name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build (Release)
        run: dotnet build plugin/FcHub.slnx --configuration Release

      - name: Unit and contract tests
        run: dotnet test plugin/FcHub.slnx --configuration Release --no-build

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -File plugin/FcHub/bin | Select-Object -ExpandProperty FullName

      - name: Dry-run pluginmaster.json (same script the release uses)
        shell: pwsh
        run: |
          $manifest = "plugin/FcHub/bin/x64/Release/FcHub/FcHub.json"
          $version = (Get-Content $manifest -Raw | ConvertFrom-Json).AssemblyVersion
          python scripts/make_pluginmaster.py $manifest "v$version" "${{ github.repository }}" pluginmaster.json
          Get-Content pluginmaster.json

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: FcHub
          path: plugin/FcHub/bin/x64/Release/FcHub/*
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web tests, typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact versions from the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (API + React client)
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Test (API + built client)
        run: npm test
