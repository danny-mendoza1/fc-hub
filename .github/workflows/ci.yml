name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a newly published advisory against something we already ship fails a run even
  # when nobody opens a PR (Mondays 14:17 UTC).
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build (Release; NuGet audit fails on high or critical, locked restore)
        run: dotnet build plugin/FcHub.slnx --configuration Release

      - name: Unit and contract tests
        run: dotnet test plugin/FcHub.slnx --configuration Release --no-build

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -File plugin/FcHub/bin | Select-Object -ExpandProperty FullName

      - name: Dry-run pluginmaster.json (same script the release uses)
        shell: pwsh
        run: |
          $manifest = "plugin/FcHub/bin/x64/Release/FcHub/FcHub.json"
          $version = (Get-Content $manifest -Raw | ConvertFrom-Json).AssemblyVersion
          python scripts/make_pluginmaster.py $manifest "v$version" "${{ github.repository }}" pluginmaster.json
          Get-Content pluginmaster.json

      - name: Upload plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FcHub
          path: plugin/FcHub/bin/x64/Release/FcHub/*
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web tests, typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact versions from the lockfile, no install scripts)
        # Dependencies' install scripts are a common supply-chain attack path, and nothing CI uses
        # needs them (esbuild's only re-checks its binary; workerd's is for `wrangler dev`).
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Lint and format check (Biome)
        run: npm run lint

      - name: Typecheck (API + React client)
        run: npm run typecheck

      - name: Build client
        run: npm run build

      - name: Test (API + built client)
        run: npm test

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (Playwright)
        run: npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
