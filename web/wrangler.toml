# Cloudflare Workers config. See web/README.md for first-time setup.
name = "fc-hub"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

# Handy for the first deploy. Once a custom domain with Cloudflare Access sits in front,
# set this to false so the unprotected *.workers.dev URL stops serving the app.
workers_dev = true

# The React UI, built by `npm run build` (vite) from client/ into dist/. Only the API and
# /healthz run the Worker; the page and its files come straight from Cloudflare's asset server
# (no Worker run, so faster and cheaper), with the same security and cache headers from the
# dist/_headers file the build generates (src/security-headers.ts).
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "fc-hub"
# Replace with the id printed by `npx wrangler d1 create fc-hub`.
database_id = "1dab7251-7263-4eea-b729-16afe4fca447"
migrations_dir = "migrations"

# Run the Worker next to D1 (primary in ENAM, eastern North America) instead of at the edge nearest
# each user. A page request makes 2-3 D1 queries one after another; at the edge each one crosses
# the country (Chicago ~25 ms, Portland ~70 ms per trip), while pinned the request crosses once and
# the queries stay local. Static files still come from the nearest edge (assets don't run the
# Worker; see run_worker_first above). Smart Placement would do this automatically but needs more
# traffic than a few members send. To undo, delete this block and deploy.
[placement]
region = "aws:us-east-1"

[observability]
enabled = true

# Denial-of-wallet guard: cap CPU per request (a real upload uses well under 100 ms). The default
# on Workers Paid is much higher. Waiting on D1 or the network doesn't count as CPU.
[limits]
cpu_ms = 5000

# Cost-guard overrides (ADR 0005; defaults in src/limits.ts). Uncomment, edit, `npm run deploy`.
# For one member only, use the admin API instead (web/README.md, "Limits"); no deploy needed.
# [vars]
# LIMIT_MEMBER_DAILY_WRITE_ROWS = "300000"
# LIMIT_SITE_DAILY_WRITE_ROWS = "1000000"
# LIMIT_ITEMS_PER_UPLOAD = "10000"
# WRITES_ENABLED = "false"   # emergency read-only mode

# Secrets (never commit): `npx wrangler secret put ADMIN_TOKEN`
