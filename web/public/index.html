<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FC Hub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">◆</span> FC Hub</h1>
      <nav class="tabs" id="tabs" hidden>
        <button type="button" class="tab" data-view="search" aria-current="page">Search</button>
        <button type="button" class="tab" data-view="overview">Who's uploaded</button>
      </nav>
      <div class="session" id="session" hidden>
        <span id="member-name"></span>
        <button type="button" class="link" id="sign-out">Sign out</button>
      </div>
    </header>

    <main>
      <section id="view-login" class="card login" hidden>
        <h2>Sign in</h2>
        <p class="muted">Use the same personal key you put in the FC Hub plugin settings.</p>
        <form id="login-form" autocomplete="off">
          <label for="api-key">API key</label>
          <input id="api-key" name="apiKey" type="password" placeholder="fch_…" required spellcheck="false" />
          <button type="submit">Sign in</button>
          <p class="error" id="login-error" role="alert"></p>
        </form>
      </section>

      <section id="view-search" hidden>
        <div class="searchbar">
          <input id="query" type="search" placeholder="Search items: tincture, iron ore, or an item id" autocomplete="off" spellcheck="false" />
        </div>
        <p class="muted" id="search-status" aria-live="polite"></p>
        <div id="results"></div>
      </section>

      <section id="view-overview" hidden>
        <p class="muted">Each section shows when it was last captured in game. Retainers and the FC chest refresh when someone opens them.</p>
        <div id="overview"></div>
      </section>
    </main>
  </body>
</html>
